version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: gender-betting-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gender_betting
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # optional, remove if you don't need external access

  app:
    build: .
    container_name: gender-betting-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gender_betting?schema=public
    ports:
      - "3000:3000"

volumes:
  postgres_data:
